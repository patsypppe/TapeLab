services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tapelab
      POSTGRES_USER: tapelab
      POSTGRES_PASSWORD: tapelab
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapelab -d tapelab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
