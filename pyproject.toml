[project]
name = "tapelab"
version = "0.1.0"
description = "Evidence-grounded AI research analyst over SEC filings"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pydantic>=2.7", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
